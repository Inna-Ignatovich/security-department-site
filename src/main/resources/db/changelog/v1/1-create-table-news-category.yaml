databaseChangeLog:
  - changeSet:
      id: 1-create-table-news-category
      author: i.ignatovich
      changes:
        - createTable:
            tableName: news_category
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
